# mode: dark
# Catppuccin Mocha, tuned for readability.
# Changed from stock: primary/dim/bright foreground #CDD6F4 -> #e6ebfa.
# Stock is 19% less luminous than it looks like it should be and reads
# as "faded". #e6ebfa keeps Mocha's blue-white hue at 13.8:1 contrast.
# Do not edit directly if you want stock Mocha back:
#   themes/themes/catppuccin_mocha.toml

[colors.primary]
background = '#1E1E2E' # base
foreground = '#e6ebfa' # brightened text
dim_foreground = '#e6ebfa'
bright_foreground = '#e6ebfa'

[colors.cursor]
text = '#1E1E2E'
cursor = '#F5E0DC' # rosewater

[colors.vi_mode_cursor]
text = '#1E1E2E'
cursor = '#B4BEFE' # lavender

[colors.search.matches]
foreground = '#1E1E2E'
background = '#A6ADC8' # subtext0

[colors.search.focused_match]
foreground = '#1E1E2E'
background = '#A6E3A1' # green

[colors.footer_bar]
foreground = '#1E1E2E'
background = '#A6ADC8'

[colors.hints.start]
foreground = '#1E1E2E'
background = '#F9E2AF' # yellow

[colors.hints.end]
foreground = '#1E1E2E'
background = '#A6ADC8'

[colors.selection]
text = '#1E1E2E'
background = '#F5E0DC' # rosewater

[colors.normal]
black = '#45475A' # surface1
red = '#F38BA8'
green = '#A6E3A1'
yellow = '#F9E2AF'
blue = '#89B4FA'
magenta = '#F5C2E7'
cyan = '#94E2D5'
white = '#BAC2DE' # subtext1

[colors.bright]
black = '#585B70' # surface2
red = '#F38BA8'
green = '#A6E3A1'
yellow = '#F9E2AF'
blue = '#89B4FA'
magenta = '#F5C2E7'
cyan = '#94E2D5'
white = '#A6ADC8' # subtext0

[colors.dim]
black = '#45475A'
red = '#F38BA8'
green = '#A6E3A1'
yellow = '#F9E2AF'
blue = '#89B4FA'
magenta = '#F5C2E7'
cyan = '#94E2D5'
white = '#BAC2DE'
