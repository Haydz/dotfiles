# =========================
# ~/.config/alacritty/alacritty.toml
# =========================

# ----- Shell: start the user's login shell, as a login shell -----
# Was hardcoded to /opt/homebrew/bin/bash, which does not exist on Linux —
# Alacritty would fail to spawn a shell at all there. Going through /bin/sh
# (present on both platforms) lets $SHELL resolve per-machine, with a
# fallback in case $SHELL is unset in a GUI launch context. `exec` replaces
# the sh process so no extra shell is left in the tree.
# Verified on macOS: same binary as before, and shopt login_shell = yes.
[terminal]
shell = { program = "/bin/sh", args = ["-c", "exec \"${SHELL:-/bin/bash}\" -l"] }

# ----- Environment -----
[env]
TERM = "xterm-256color"

# ----- Window -----
[window]
decorations = "full"        # "full", "buttonless", or "none"
opacity = 1.0             # fully opaque: transparency lowers text contrast
dynamic_title = true
padding = { x = 7, y = 4 }

# ----- Theme Import -----
[general]
# Switch theme with `term-theme light|dark|toggle`, or Cmd+Shift+T.
# That rewrites the filename on the import line just below, in place.
#
#   theme-light.toml  #e0e4ec bg — near-white, low pupil adaptation vs a browser
#   theme-dark.toml   #16161e bg — generated palette, all body text above 7:1
#
# It edits THIS file rather than swapping a separate active-theme file on
# purpose. Alacritty builds its file-watch list at startup, so a newly
# created import is not watched until Alacritty restarts — but this file
# always is. Editing it means the toggle works in already-running windows.
import = [
    "~/.config/alacritty/theme-dark.toml"
]

# ----- Scrolling -----
[scrolling]
history = 10000
multiplier = 3

# ----- Font -----
# Swap fonts by changing the family on all four lines below; Alacritty
# live-reloads on save. Candidates, with the cask that installs them:
#   "AtkynsonMono Nerd Font"   font-atkynson-mono-nerd-font   <- current
#       Nerd Font patch of Atkinson Hyperlegible Mono, designed by the
#       Braille Institute for low-vision legibility. Unusually distinct
#       glyph shapes: slashed 0, tailed l, serifed I, very open apertures
#       on c/e/a/s. No programming ligatures.
#   "JetBrainsMono Nerd Font"  font-jetbrains-mono-nerd-font  (previous)
#
# Verify a family resolves BEFORE trusting it — a family or style Alacritty
# cannot match falls back to a system font silently, which looks like the
# config having no effect. There is no `fc-list` on macOS; ask CoreText:
#   python3 -c 'import ctypes,ctypes.util;ct=ctypes.cdll.LoadLibrary(
#     ctypes.util.find_library("CoreText"))'  # see git log for the full probe
# or just launch a throwaway window and look: `alacritty --config-file X -vv`.
[font]
# Point size is NOT perceived size — x-height is, and Atkynson's is smaller
# per em than JetBrains Mono's, so the numbers do not transfer between them:
#
#            x-height  cap-height  advance  line-height   (per 1000 em)
#   Atkynson      496         668      632         1197
#   JetBrains     550         730      600         1320
#
# Consequence: these numbers do not transfer from the old JetBrains 18.0.
# 20.0 is the size that *reproduces* it (18 * 550/496 = 19.96), not an
# increase; Atkynson at 18.0 would render ~10% smaller than the old font
# did, despite the "hyperlegible" billing. The legibility win is the glyph
# shapes, not scale. Don't tune by eye against the point number — use the
# x-height column, which is what perceived size actually tracks.
#
# Measured ladder (Retina logical px, `offset.y = 2` included in the height;
# column/row counts are for a ~1800x1000px window):
#
#   size  x-height  vs JetBrains@18  cell w x h    cols  rows
#   19.0    9.42px            -5%    12.0 x 24.7    148    40
#   20.0    9.92px            +0%    12.6 x 25.9    141    38
#   22.0   10.91px           +10%    13.9 x 28.3    128    35
#   23.0   11.41px           +15%    14.5 x 29.5    122    33
#   24.0   11.90px           +20%    15.2 x 30.7    117    32
#   26.0   12.90px           +30%    16.4 x 33.1    108    29
#
# Atkynson's cells are ~17% wider than JetBrains Mono's at equal x-height,
# so going up costs columns faster here than it used to. If a side-by-side
# tmux split stops fitting, step DOWN this ladder rather than cutting
# `offset.x` — horizontal crowding is the thing that actually hurts to read.
#
# Current setting is 17.0 — one step below the measured range above, so the
# numbers in the ladder don't cover it. Re-measure before quoting cols/rows.
size = 17.0

# style = "Medium" not "Regular": macOS stopped doing subpixel antialiasing in
# Mojave, so Regular-weight text renders thin and washed out. Medium compensates.
# Atkynson ships only Light, Regular, Medium and Bold (plus italics) — it has
# no SemiBold/ExtraBold, so do not copy those over from a JetBrains config.
normal = { family = "AtkynsonMono Nerd Font", style = "Medium" }
bold = { family = "AtkynsonMono Nerd Font", style = "Bold" }
italic = { family = "AtkynsonMono Nerd Font", style = "Medium Italic" }
bold_italic = { family = "AtkynsonMono Nerd Font", style = "Bold Italic" }

# Extra breathing room between lines and columns — reduces glyph crowding,
# which is a bigger eye-strain factor than raw font size.
offset = { x = 0, y = 2 }

# ----- Cursor -----
[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

# ----- Selection copy to clipboard (mac-like) -----
[selection]
save_to_clipboard = true

# ----- macOS key bindings (⌘C/⌘V, etc.) -----
[keyboard]
# Copy
[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"
# Paste
[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"
# Clear scrollback
[[keyboard.bindings]]
key = "K"
mods = "Command"
action = "ClearHistory"
# New window (if you launch Alacritty via the app)
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"
# Search
[[keyboard.bindings]]
key = "F"
mods = "Command"
action = "SearchForward"
# Toggle light/dark theme. Two bindings, one per platform convention:
#   macOS  Cmd+Shift+T     ("Command" is an alias for Super/Meta)
#   Linux  Ctrl+Shift+T    (Super is usually grabbed by the window manager)
# Both are defined on both platforms — they are different key combos, so
# only one can ever match a given press. Do NOT give the same combo two
# bindings: both would fire, flip back, and look like nothing happened.
#
# Spawned via /bin/sh rather than the script directly, because Alacritty
# does not expand ~ or $PATH in `program` and an absolute path would hard
# code /Users/... or /home/... . /bin/sh exists on macOS and Linux alike,
# and $HOME is always set.
[[keyboard.bindings]]
key = "T"
mods = "Command|Shift"
command = { program = "/bin/sh", args = ["-c", "exec \"$HOME/.local/bin/term-theme\""] }

[[keyboard.bindings]]
key = "T"
mods = "Control|Shift"
command = { program = "/bin/sh", args = ["-c", "exec \"$HOME/.local/bin/term-theme\""] }

# Pass Ctrl+B through to tmux (don't intercept it)
[[keyboard.bindings]]
key = "B"
mods = "Control"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
