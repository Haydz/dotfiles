# mode: light
# Started from GitHub Light High Contrast, then re-solved for contrast.
#
# Background is knocked back from stock #ffffff to take the glare off while
# staying close enough to a white browser that glancing between the two
# costs almost no pupil adaptation (1.08:1 between them — 1.00:1 is exact).
#
# To go softer or brighter, walk this ladder. Text contrast stays far above
# the 7:1 AAA bar the whole way, so pick purely on comfort. The "vs white"
# column is what actually predicts whether you'll notice a step: anything
# under ~10% is invisible without a side-by-side.
#
#   bg       vs white   text    vs browser
#   #ffffff   - 0.0%   20.5:1     1.00:1   stock, glary
#   #f4f6f9   - 8.0%   19.0:1     1.08:1   too subtle to perceive
#   #e8ebf0   -17.1%   17.2:1     1.20:1
#   #e0e4ec   -22.6%   16.1:1     1.27:1   <- current
#   #d8dde6   -28.0%   15.1:1     1.36:1
#   #d0d6e0   -33.1%   14.1:1     1.46:1
#   #c8cfdb   -38.0%   13.1:1     1.57:1   starts reading as grey, not light
#
# Warm alternatives if cool grey feels clinical — same idea, cream tint:
#   #faf8f4  -6%  /  #f5f2ec  -11%  /  #efeade  -18%  /  #e8e0cd  -25%
#
# Every ANSI colour below is generated against THIS background, not stock
# white. That distinction is the whole point: the previous version of this
# file carried stock GitHub values plus a comment claiming #515a63 was
# "7.0:1". It is — against #ffffff. Against the #e0e4ec actually in use it
# measured 5.51:1, and four other slots were worse:
#
#   cyan          3.87:1   below AA, normal AND bright
#   bright.blue   4.01:1   below AA
#   white         5.51:1
#   red/blue/magenta/bright.black/bright.green   6.1-6.4:1
#
# Contrast is a property of a PAIR, so nothing here transfers from an
# upstream theme with a different background. Re-solve, don't copy.
#
#   slot                target     measured
#   normal (6 hues)      7.0:1    7.00-7.03:1
#   bright (6 hues)     10.5:1   10.47-10.60:1   darker = emphasis
#   greys               7.0:1+   7.08-14.84:1
#
# Bright is DARKER than normal here, the opposite of the dark theme. On a
# light background lighter means lower contrast, so the only way to make
# emphasis both louder and readable is to go down, not up. Steps are
# dE 9-10; the old file had magenta, cyan and white identical across
# normal/bright, so emphasis was invisible.
#
# Greys are a deliberate ladder rather than one repeated value:
#   bright.black  7.08:1  comments, hunk headers, ls metadata (lightest)
#   normal.white  9.99:1  secondary text
#   bright.white 12.41:1  emphasised secondary
#   normal.black 14.84:1  body text
#
# Stock reference: themes/themes/github_light_high_contrast.toml

[colors.primary]
background = '#e0e4ec'
foreground = '#010409'
dim_foreground = '#2f3337'
bright_foreground = '#000000'

[colors.cursor]
text = '#e0e4ec' # matches background so a block cursor inverts cleanly
cursor = '#0e1116'

[colors.vi_mode_cursor]
text = '#e0e4ec'
cursor = '#0042a8'

[colors.search.matches]
foreground = '#e0e4ec'
background = '#2f3337'

[colors.search.focused_match]
foreground = '#e0e4ec'
background = '#115523'

[colors.footer_bar]
foreground = '#e0e4ec'
background = '#2f3337'

[colors.hints.start]
foreground = '#e0e4ec'
background = '#624323'

[colors.hints.end]
foreground = '#e0e4ec'
background = '#2f3337'

[colors.selection]
text = '#e0e4ec'
background = '#2f3337'

# 7.0:1 each — body text.
[colors.normal]
black = '#0e1116'   # 14.84:1
red = '#980118'
green = '#115523'
yellow = '#624323'
blue = '#0042a8'
magenta = '#5c22b4'
cyan = '#005258'
white = '#2f3337'   #  9.99:1  secondary text

# 10.5:1 each — darker than normal, because on a light ground that is what
# "louder" means. A visible dE 9-10 step from normal.
[colors.bright]
black = '#46494f'   #  7.08:1  comments, git hunk headers, ls metadata
red = '#65000c'
green = '#003710'
yellow = '#462806'
blue = '#002a70'
magenta = '#400088'
cyan = '#003539'
white = '#1f2327'   # 12.41:1
